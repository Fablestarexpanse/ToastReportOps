name: CI

on:
  push:
    branches: [main]
  pull_request:
  # weekly, so a newly published advisory against a dependency shows up even when
  # nothing is being pushed
  schedule:
    - cron: "17 14 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --all-extras   # tests cover the optional mesh service
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Typecheck (mypy)
        run: uv run mypy
      - name: Tests (pytest)
        run: uv run pytest
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off

  operator-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: operator-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Dependency audit (shipped packages)
        run: npm audit --omit=dev --audit-level=high
