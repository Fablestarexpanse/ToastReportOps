# Toast Report Workstation
# Profiles:
#   desktop  — full stack on the operator's machine
#   degraded — PSPS sentinel: official-API polling + site updates only (free-tier VM)
# Later phases add: gpu-worker, publisher, site-builder, operator-ui.

# Third-party images are pinned by tag AND digest (2026-10-31): a tag can be re-pointed,
# a digest cannot, and "latest" once changed model behaviour under us. Each pin is what
# that image's :latest was on the pin date, so pinning changed nothing that day.
# To upgrade one, look up the new tag's digest on Docker Hub, change it here, test.
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    TOAST_DB_PATH: /data/toast.db
    TOAST_DATA_DIR: /data
  volumes:
    - ./data:/data
    - ./prompts:/app/prompts:ro   # versioned prompts read at runtime
  restart: unless-stopped

services:
  api:
    <<: *backend
    # degraded too: a PSPS sentinel with no API serves nothing and can build
    # nothing — the runbook told the operator to use it, and it was not there.
    profiles: [desktop, degraded]
    command: python -m toast.api.app
    environment:
      TOAST_DB_PATH: /data/toast.db
      TOAST_DATA_DIR: /data
      API_BIND: 0.0.0.0        # container-internal; published on loopback only below
    ports:
      - "127.0.0.1:8400:8400"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8400/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    <<: *backend
    profiles: [desktop, degraded]
    command: python -m toast.queue.worker
    environment:
      TOAST_DB_PATH: /data/toast.db
      TOAST_DATA_DIR: /data
      HEALTH_PORT: "8410"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8410/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *backend
    profiles: [desktop, degraded]
    command: python -m toast.scheduler
    environment:
      TOAST_DB_PATH: /data/toast.db
      TOAST_DATA_DIR: /data
      HEALTH_PORT: "8411"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8411/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  litestream:
    profiles: [desktop]
    image: litestream/litestream:0.3
    command: replicate -config /etc/litestream.yml
    env_file: .env
    volumes:
      - ./data:/data
      - ./infra/litestream.yml:/etc/litestream.yml:ro
    restart: unless-stopped

  # ---- active research layer (Local Deep Research + SearXNG) ----
  # On-demand agentic research on the host's Ollama. Desktop profile only —
  # excluded from the PSPS degraded profile. LDR reports are operator research
  # material; facts enter the ledger only via the validated point-at-URL path.
  searxng:
    profiles: [desktop]
    image: searxng/searxng:2026.10.30-ffa88e3ba@sha256:f4aa660c54d062dedb268be84e821ea24e39f48c7a496af8dd02cc9eedb93847
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # SearXNG reads this in place of settings.yml's secret_key; set it in .env
      SEARXNG_SECRET: "${SEARXNG_SECRET:-toast-report-searxng-local-only-not-secret}"
    restart: unless-stopped

  ldr:
    profiles: [desktop]
    image: localdeepresearch/local-deep-research:1.10.7@sha256:ce95481a35d3eebc2c1ae7bd34fad426108c3fb8d1a22f66c9e772276869c2f0
    depends_on:
      - searxng
    environment:
      LDR_WEB_HOST: 0.0.0.0
      LDR_WEB_PORT: "5000"
      LDR_DATA_DIR: /data
      LDR_LLM_PROVIDER: ollama
      LDR_LLM_OLLAMA_URL: http://llm:11434
      LDR_SEARCH_TOOL: searxng
      LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL: http://searxng:8080
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ldr_data:/data
    restart: unless-stopped

  # Icecast: the operator's OWN live scanner stream. rtl_airband on the SDR
  # host publishes CAL FIRE VHF here (see docs/RADIO-SETUP.md — dual output:
  # this mount for live listening, the file inbox for the archive/transcripts).
  # The RADIO tab's seeded "My SDR — LIVE" channel plays it in-app. Free
  # forever, zero third-party terms, and it keeps working through a PSPS.
  # Loopback-bound like everything else; passwords are stack-internal knobs,
  # not secrets (override in .env if the mount is ever exposed beyond localhost).
  icecast:
    profiles: [desktop]
    image: libretime/icecast:2.4.4@sha256:91150fa27342bb6f1aca90a8dfe0a78912de69f0e0c2112470370251d5e71326
    environment:
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-toast-sdr-source}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-toast-sdr-admin}"
      ICECAST_RELAY_PASSWORD: "${ICECAST_RELAY_PASSWORD:-toast-sdr-relay}"
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped

  # Mesh listener: the public Meshtastic MQTT firehose filtered to a NorCal
  # picture. Persistent subscription, so a service rather than a job.
  # Optional (2026-10-31): the listener uses the GPL-3.0 Meshtastic library, so it is
  # not part of the default stack. Its image alone is built with the `mesh` extra.
  # Turn it on with TOAST_MESH=1 in .env (the .cmd buttons honour it) or
  # `docker compose --profile desktop --profile mesh up -d`.
  mesh:
    <<: *backend
    profiles: [mesh]
    build:
      context: ./backend
      args:
        TOAST_EXTRAS: mesh
    command: python -m toast.mesh.listener

  # The language model is part of the stack, not a separate program to
  # remember. First boot pulls the models it needs into OLLAMA_MODELS_DIR
  # (reuse an existing Ollama cache by pointing that at it); every later boot
  # is instant. The backend talks to http://llm:11434/v1 — the same
  # OpenAI-compatible contract, so a cloud key in LLM_BASE_URL still overrides.
  # Models are NOT downloaded automatically: "Install Models.cmd" (or
  # python -m toast.modelsetup install) downloads official, digest-pinned models with
  # a pin check, a GPU-fit check and a smoke test — see docs/MODELS.md. Set
  # LLM_AUTO_PULL=1 to restore the old unverified first-boot pull.
  llm:
    profiles: [desktop]
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 4
        if [ "${LLM_AUTO_PULL:-0}" = "1" ]; then
          ollama pull "${LLM_PULL_MODEL:-qwen3.5:9b}" || true
          ollama pull "${LLM_EMBED_PULL_MODEL:-nomic-embed-text}" || true
        fi
        wait
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - "${OLLAMA_MODELS_DIR:-ollama_models}:/root/.ollama/models"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ldr_data:
  ollama_models:
